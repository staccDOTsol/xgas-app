<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="xGas">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10141f"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>
    <linearGradient id="layerTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="layerMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="layerBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect width="512" height="512" rx="112" fill="url(#plate)"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#34d399" stroke-width="18" opacity="0.95"/>

  <!-- Three stacked orbit chevrons (isometric plates), optically centered -->
  <g filter="url(#soft)">
    <!-- top -->
    <path fill="url(#layerTop)" d="M128 168 L256 104 L384 168 L256 232 Z"/>
    <!-- mid -->
    <path fill="url(#layerMid)" d="M128 248 L256 184 L384 248 L256 312 Z"/>
    <!-- bottom -->
    <path fill="url(#layerBot)" d="M128 328 L256 264 L384 328 L256 392 Z"/>
  </g>

  <!-- Hairline separators for depth at 512 -->
  <g fill="none" stroke="#0b0e17" stroke-width="6" stroke-linejoin="round" opacity="0.35">
    <path d="M128 168 L256 232 L384 168"/>
    <path d="M128 248 L256 312 L384 248"/>
    <path d="M128 328 L256 392 L384 328"/>
  </g>
</svg>
