[profile.default]
src = "src"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "v4-core/=src/amm/v4-core/",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@account-abstraction/contracts/=lib/account-abstraction/"
]

# Tempo has no native gas token: BALANCE/SELFBALANCE/CALLVALUE are 0, a new
# storage slot costs 250_000 gas, and contract bytes cost 1_000 gas each.
# Plasma and Robinhood stay on the default profile. Gas figures for a Tempo
# deploy come from `FOUNDRY_PROFILE=tempo`.
[profile.tempo]
tempo = true

[rpc_endpoints]
plasma = "https://rpc.plasma.to"
tempo = "https://rpc.tempo.xyz"

# Plasma verification is Etherscan API v2 (chainid 9745). Plasmascan is the
# explorer UI (https://plasmascan.to). Tempo is Sourcify, not this table:
# `--verifier sourcify --verifier-url https://contracts.tempo.xyz`.
[etherscan]
plasma = { key = "${PLASMA_ETHERSCAN_API_KEY}", chain = 9745, url = "https://api.etherscan.io/v2/api?chainid=9745" }
